function setTab(tab) {
  S.view.tab = tab;
  app.querySelectorAll('.tabs button').forEach((b) => {
    const on = b.dataset.tab === tab;
    b.setAttribute('aria-selected', String(on));
    b.tabIndex = on ? 0 : -1;
  });
  const panel = document.getElementById('panel');
  panel.setAttribute('aria-labelledby', `tab-${tab}`);
  if (tab === 'rate') drawRate();
  else drawSkipped();
}

function drawSkipped() {
  const panel = document.getElementById('panel');
  const l = findLecture(S.view.id);
  if (!panel || !l) return;
  const rs = ratingsFor(l.id);
  if (!rs.length) {
    panel.innerHTML = `<div class="nobody">
      <p>Nobody’s rated this one yet. If you went, you can be the first.</p>
      <button class="btn" type="button" id="be-first">Rate this lecture</button>
    </div>`;
    document.getElementById('be-first').addEventListener('click', () => setTab('rate'));
    return;
  }

  let { fresh, stale } = currentReport(l.id);
  if (!fresh) {
    ensureReport(l); // may finish synchronously when Claude isn't available
    ({ fresh, stale } = currentReport(l.id));
  }
  const report = fresh || stale;
  const updating = !fresh;

  if (!report) {
    panel.innerHTML = `<p class="loading">Reading what ${plural(rs.length, 'person', 'people')} said</p>`;
    return;
  }

  // Keep a half-typed question across live redraws.
  const oldInput = panel.querySelector('#ask-q');
  const typed = oldInput ? oldInput.value : '';
  const hadFocus = oldInput && document.activeElement === oldInput;

  panel.innerHTML = reportHtml(l, report, statsFor(rs), rs, updating);

  const from = S.shownScore[l.id];
  const to = (100 - report.sweat_score) / 100;
  const cover = panel.querySelector('.meter-cover');
  if (from === undefined || from !== to) {
    cover.style.setProperty('--cover', String(from === undefined ? 1 : from));
    requestAnimationFrame(() => requestAnimationFrame(() => cover.style.setProperty('--cover', String(to))));
  } else {
    cover.style.transition = 'none';
    cover.style.setProperty('--cover', String(to));
  }
  S.shownScore[l.id] = to;

  const askInput = panel.querySelector('#ask-q');
  if (askInput) {
    askInput.value = typed;
    if (hadFocus) askInput.focus();
    panel.querySelector('.ask-form').addEventListener('submit', (e) => ask(e, l));
  }
  panel.querySelectorAll('[data-debt]').forEach((b) => b.addEventListener('click', () => debtAction(l.id, b.dataset.debt)));
  panel.querySelectorAll('[data-note]').forEach((b) => b.addEventListener('click', () => openPanel('note', b.dataset.note)));
  const retry = panel.querySelector('#retry');
  if (retry) {
    retry.addEventListener('click', () => {
      delete S.localReports[l.id];
      drawSkipped();
    });
  }
}

function reportHtml(l, r, stats, rs, updating) {
  const v = VERDICT[r.verdict];
  const total = r.catch_up.reduce((s, x) => s + x.minutes, 0);
  const rv = r.ratings_verdict;
  const overridden = r.source === 'claude' && rv && rv !== r.verdict;
  const raised = overridden && ORDER.indexOf(r.verdict) > ORDER.indexOf(rv);
  const li = (xs) => xs.map((x) => `<li>${esc(x)}</li>`).join('');
  const answers = S.answers[l.id] || [];
  const canAsk = S.sample && !S.sampleOff;

  return `
    <div class="verdict-card v-${r.verdict}">
      <div class="verdict">
        <p class="verdict-word">${v.word}</p>
        <div class="meter" role="img" aria-label="Sweat level ${r.sweat_score} out of 100"><div class="meter-cover"></div></div>
        <div class="meter-scale"><span>No sweat</span><span>Sweat level ${r.sweat_score}/100</span><span>Panic</span></div>
        ${updating ? `<p class="updating">New rating in. Claude is updating the verdict.</p>` : ''}
        ${r.headline ? `<p class="headline">${esc(r.headline)}</p>` : ''}
        ${r.why ? `<p class="why">${esc(r.why)}</p>` : ''}
        ${r.disagreement ? `<p class="why">${esc(r.disagreement)}</p>` : ''}
        ${
          overridden
            ? `<p class="override">The ratings alone said <strong class="verdict-word v-${rv}">${VERDICT[rv].label}</strong>. Claude ${
                raised ? 'raised' : 'lowered'
              } it after reading the notes.</p>`
            : ''
        }
        ${
          r.note && !updating
            ? `<p class="override">${esc(r.note)} ${r.retry && canAsk ? `<button class="link-btn" type="button" id="retry">Ask Claude again</button>` : ''}</p>`
            : ''
        }
      </div>
    </div>

    <div class="lecture-grid">
      <div class="lg-main">
        ${r.said_in_room.length ? `<section class="section heads-up"><h2>Said in the room</h2><ul class="bullets">${li(r.said_in_room)}</ul></section>` : ''}
        ${r.covered.length ? `<section class="section"><h2>What you missed</h2><ul class="bullets">${li(r.covered)}</ul></section>` : ''}
        <section class="section">
          <h2>Ask the people who went</h2>
          ${
            canAsk
              ? `<form class="ask-form">
                  <input type="text" id="ask-q" name="q" placeholder="Did they say what’s on the exam?" maxlength="300" aria-label="Your question">
                  <button class="btn" type="submit">Ask</button>
                </form>
                <div class="answers" aria-live="polite">${answers.map(answerHtml).join('')}</div>`
              : `<p class="muted">Asking questions needs Claude, which isn’t available here.</p>`
          }
        </section>
      </div>
      <aside class="lg-side" aria-label="Your catch-up">
        <section class="catchup-card">
          <h2>Your catch-up${total ? ` <small>about ${fmtMin(total)}</small>` : ''}</h2>
          ${
            r.catch_up.length
              ? `<ol class="plan">${r.catch_up
                  .map((s) => `<li><span>${esc(s.step)}</span><span class="mins">${fmtMin(s.minutes)}</span></li>`)
                  .join('')}</ol>`
              : `<p class="muted">Nothing to catch up on.</p>`
          }
          <div class="debt-row">${debtControlHtml(l)}</div>
          ${r.catch_up.length ? calendarLinks(l, r, total) : ''}
        </section>
      </aside>
    </div>

    <section class="section room">
      <h2>From the room <small>${plural(stats.n, 'rating', 'ratings')}</small></h2>
      <dl class="stats">
        <div><dt>Usefulness</dt><dd>${stats.avgUsefulness}/5</dd></div>
        <div><dt>Say it’s on the exam</dt><dd>${stats.examShare}%</dd></div>
        <div><dt>Say it was new</dt><dd>${stats.newShare}%</dd></div>
        <div><dt>Recorded</dt><dd>${{ yes: 'Yes', no: 'No', unsure: 'Unclear' }[stats.recorded]}</dd></div>
      </dl>
      <ul class="notes">${[...rs]
        .sort((a, b) => String(b.updatedAt || b.createdAt).localeCompare(String(a.updatedAt || a.createdAt)))
        .map(noteHtml)
        .join('')}</ul>
      <p class="source">${
        r.source === 'claude'
          ? `Verdict written by Claude from ${plural(stats.n, 'attendee rating', 'attendee ratings')}. Confidence: ${r.confidence}.`
          : 'Verdict estimated from the ratings alone.'
      }</p>
    </section>`;
}

// A calendar block for the catch-up, prefilled in Google Calendar or Outlook.
function catchUpSlot(totalMin) {
  const start = new Date();
  start.setMinutes(0, 0, 0);
  start.setHours(start.getHours() + 1);
  if (start.getHours() >= 21 || start.getHours() < 8) {
    if (start.getHours() >= 21) start.setDate(start.getDate() + 1);
    start.setHours(10);
  }
  const end = new Date(start.getTime() + Math.max(15, totalMin) * 60e3);
  return { start, end };
}

function calendarLinks(l, r, totalMin) {
  const { start, end } = catchUpSlot(totalMin);
  const title = `${VERDICT[r.verdict].label}: catch up on ${l.module} ${l.title}`;
  const lines = [r.headline];
  if (r.said_in_room.length) lines.push('', 'Said in the room:', ...r.said_in_room.map((x) => '- ' + x));
  if (r.catch_up.length) lines.push('', 'Catch-up plan:', ...r.catch_up.map((s) => `- ${s.step} (${fmtMin(s.minutes)})`));
  lines.push('', 'From SweatCheck');
  const details = lines.join('\n');
  const g = (d) => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const google =
    'https://calendar.google.com/calendar/render?action=TEMPLATE' +
    `&text=${encodeURIComponent(title)}&dates=${g(start)}/${g(end)}&details=${encodeURIComponent(details)}`;
  const outlook =
    'https://outlook.office.com/calendar/0/deeplink/compose?path=%2Fcalendar%2Faction%2Fcompose&rru=addevent' +
    `&subject=${encodeURIComponent(title)}&startdt=${encodeURIComponent(start.toISOString())}` +
    `&enddt=${encodeURIComponent(end.toISOString())}&body=${encodeURIComponent(details)}`;
  return `<div class="cal-links">
      <span class="muted">Block out time for it:</span>
      <a class="btn btn-quiet" href="${google}" target="_blank" rel="noopener">Add to Google Calendar</a>
      <a class="btn btn-quiet" href="${outlook}" target="_blank" rel="noopener">Add to Outlook</a>
    </div>`;
}

function answerHtml(a) {
  return `<div class="answer"><span class="q">${esc(a.q)}</span>${
    a.pending ? `<span class="loading">Checking the notes</span>` : a.error ? `<span class="form-error">${esc(a.error)}</span>` : esc(a.a)
  }</div>`;
}

const CHEVRON =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

// A note shows only its rating and what was covered; the rest opens in a small window.
function noteHtml(r) {
  const u = clampInt(r.usefulness, 1, 5, 3);
  const pips = [1, 2, 3, 4, 5].map((i) => `<i class="${i <= u ? 'on' : ''}"></i>`).join('');
  return `<li class="note">
    <button type="button" class="note-btn" data-note="${esc(r.id)}" aria-haspopup="dialog" aria-label="Usefulness ${u} out of 5. ${esc(r.covered)}. Show details">
      <span class="pips" aria-hidden="true">${pips}</span>
      <span class="note-text">${esc(r.covered)}</span>
      ${CHEVRON}
    </button>
  </li>`;
}

function drawNotePanel(id) {
  const r = S.ratings.find((x) => x.id === id);
  if (!r) return false;
  const u = clampInt(r.usefulness, 1, 5, 3);
  const pips = [1, 2, 3, 4, 5].map((i) => `<i class="${i <= u ? 'on' : ''}"></i>`).join('');
  const rows = [
    ['On the exam', { yes: 'Definitely', maybe: 'Maybe', no: 'Not really' }[r.exam] || 'Not said'],
    ['Material', { new: 'Mostly new', mix: 'A bit of both', recap: 'Recap or admin' }[r.content] || 'Not said'],
    ['Recorded on Panopto', { yes: 'Yes', no: 'No', unsure: 'Not sure' }[r.recorded] || 'Not sure'],
  ];
  panel.innerHTML = `
    <div class="fp-head">
      <h2 id="fp-h">Rating details</h2>
      <button type="button" class="fp-close" id="fp-close" aria-label="Close rating details">${CLOSE_ICON}</button>
    </div>
    <div class="fp-body">
      <p class="nd-rating"><span class="pips" aria-hidden="true">${pips}</span>${u}/5 useful</p>
      <dl class="nd-list">${rows.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
      <h3 class="nd-h">What was covered</h3>
      <p class="nd-text">${esc(r.covered)}</p>
      ${r.announcements ? `<h3 class="nd-h">Said in the room</h3><p class="nd-text nd-said">${esc(r.announcements)}</p>` : ''}
      <p class="nd-when">Posted ${esc(when(r.updatedAt || r.createdAt))}${r.updatedAt ? ', edited' : ''}</p>
    </div>`;
  document.getElementById('fp-close').addEventListener('click', () => closePanel());
  return true;
}

async function ask(e, lecture) {
  e.preventDefault();
  const input = e.currentTarget.querySelector('#ask-q');
  const btn = e.currentTarget.querySelector('button');
  const question = input.value.trim();
  if (question.length < 3) return input.focus();
  const list = (S.answers[lecture.id] = S.answers[lecture.id] || []);
  const item = { q: question, pending: true };
  list.unshift(item);
  input.value = '';
  btn.disabled = true;
  const out = e.currentTarget.nextElementSibling;
  out.innerHTML = list.map(answerHtml).join('');
  const rs = ratingsFor(lecture.id);
  try {
    const { text } = await S.sample(askPrompt(lecture, rs, statsFor(rs), question), {
      modelTier: 'quick',
      onText: ({ text }) => {
        item.pending = false;
        item.a = text;
        const node = document.querySelector('.answers');
        if (node) node.innerHTML = list.map(answerHtml).join('');
      },
    });
    item.pending = false;
    item.a = text;
  } catch (ex) {
    item.pending = false;
    const code = ex && ex.code;
    if (SAMPLE_OFF_CODES.includes(code)) {
      S.sampleOff = true;
      item.error = 'Claude isn’t available here, so questions can’t be answered.';
      renderStatus();
    } else if (code === 'rate_limited') item.error = 'Claude is busy or your usage limit was reached. Try again in a bit.';
    else item.error = 'Claude couldn’t answer that. Try again.';
  } finally {
    const b = document.querySelector('.ask-form button');
    if (b) b.disabled = false;
    const node = document.querySelector('.answers');
    if (node) node.innerHTML = list.map(answerHtml).join('');
  }
}

function choices(name, options, current) {
  return options
    .map(
      ([value, label]) =>
        `<label><input type="radio" name="${name}" value="${value}" ${String(current) === String(value) ? 'checked' : ''}><span>${label}</span></label>`
    )
    .join('');
}

function drawRate() {
  const panel = document.getElementById('panel');
  const l = findLecture(S.view.id);
  if (!panel || !l) return;
  if (S.canWrite === false) {
    panel.innerHTML = `<div class="notice">You can read verdicts here, but only people invited to edit this page can post ratings.</div>`;
    return;
  }
  const mineDoc = S.ratings.find((r) => r.lectureId === l.id && isMine(r.id));
  const m = mineDoc || {};
  panel.innerHTML = `
    <form class="rate-form" novalidate>
      ${mineDoc ? `<p class="muted" style="margin:0">You already rated this lecture. Changing it updates your rating.</p>` : ''}
      <fieldset class="field">
        <legend>How useful was it?</legend>
        <div class="choices scale">${choices('usefulness', [1, 2, 3, 4, 5].map((n) => [n, n]), m.usefulness)}</div>
        <div class="scale-ends" aria-hidden="true"><span>Waste of time</span><span>Unmissable</span></div>
      </fieldset>
      <fieldset class="field">
        <legend>Will it be on the exam?</legend>
        <div class="choices">${choices('exam', [['yes', 'Definitely'], ['maybe', 'Maybe'], ['no', 'Not really']], m.exam)}</div>
      </fieldset>
      <fieldset class="field">
        <legend>Was it new material?</legend>
        <div class="choices">${choices('content', [['new', 'Mostly new'], ['mix', 'A bit of both'], ['recap', 'Recap or admin']], m.content)}</div>
      </fieldset>
      <fieldset class="field">
        <legend>Was it recorded on Panopto?</legend>
        <div class="choices">${choices('recorded', [['yes', 'Yes'], ['no', 'No'], ['unsure', 'Not sure']], m.recorded || 'unsure')}</div>
      </fieldset>
      <div class="field">
        <label for="covered">What was covered?</label>
        <p class="hint">Topics, examples, anything that wasn’t on the slides.</p>
        <textarea id="covered" name="covered" maxlength="400">${esc(m.covered || '')}</textarea>
      </div>
      <div class="field">
        <label for="announcements">Anything said in the room?</label>
        <p class="hint">Deadlines, exam hints, changes. Leave it blank if nothing.</p>
        <textarea id="announcements" name="announcements" maxlength="300">${esc(m.announcements || '')}</textarea>
      </div>
      <p class="form-error" id="form-error" role="alert" hidden></p>
      <div><button class="btn" type="submit">${mineDoc ? 'Update rating' : 'Post rating'}</button></div>
    </form>`;

  const form = panel.querySelector('form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = new FormData(form);
    const err = form.querySelector('#form-error');
    const btn = form.querySelector('button[type=submit]');
    const fail = (msg) => {
      err.textContent = msg;
      err.hidden = false;
    };
    err.hidden = true;
    if (!f.get('usefulness')) return fail('Pick how useful it was, from 1 to 5.');
    if (!f.get('exam')) return fail('Say whether it’s on the exam.');
    if (!f.get('content')) return fail('Say whether it was new material.');
    const covered = str(f.get('covered'), 400);
    if (covered.length < 3) return fail('Write a line about what was covered.');

    btn.disabled = true;
    const now = new Date().toISOString();
    const docId = `${l.id}__${voterId()}`;
    const body = {
      lectureId: l.id,
      usefulness: Number(f.get('usefulness')),
      exam: f.get('exam'),
      content: f.get('content'),
      recorded: f.get('recorded') || 'unsure',
      covered,
      announcements: str(f.get('announcements'), 300),
      createdAt: mineDoc ? mineDoc.createdAt : now,
    };
    if (mineDoc) body.updatedAt = now;
    try {
      await S.db.doc('ratings/' + docId).set(body);
      toast(mineDoc ? 'Rating updated' : 'Rating posted');
      setTab('skipped');
      window.scrollTo(0, 0);
    } catch (ex) {
      btn.disabled = false;
      if (ex && ex.code === 'invalid_argument') {
        S.canWrite = false;
        return fail('You can read this page, but only people invited to edit it can post ratings.');
      }
      fail('That didn’t save. Check your connection and try again.');
    }
  });
}

// ---------------------------------------------------------------------------
// Live data
// ---------------------------------------------------------------------------

function onData() {
  if (!(S.loaded.lectures && S.loaded.ratings && S.loaded.reports && S.loaded.modules)) return;
  if (!S.ready) {
    S.ready = true;
    renderView();
    return;
  }
  if (S.view.name === 'home') drawList();
  else if (S.view.name === 'lecture') {
    if (!S.view.rendered || !document.getElementById('panel')) renderLecture();
    else {
      drawFacts();
      if (S.view.tab === 'skipped') drawSkipped();
    }
  } else if (S.view.name === 'module') {
    if (!S.view.rendered || !document.getElementById('mpanel')) renderModule();
    else drawModule();
  }
  syncSwitches();
  if (S.view.name !== 'home') updateMini();
}

function onDbError(e) {
  if (e && (e.code === 'revoked' || e.code === 'not_granted')) {
    S.absent = true;
    renderView();
  }
}

function announce(change) {
  const r = change.doc.data();
  if (!r) return;
  const l = findLecture(r.lectureId);
  if (!l) return;
  const viewing = S.view.name === 'lecture' && S.view.id === l.id;
  const what = change.type === 'added' ? 'New rating' : 'Updated rating';
  toast(viewing ? `${what} from someone who went. Updating the verdict.` : `${what}: ${l.module} ${l.title}`);
}

function subscribe(db) {
  db.collection('lectures').onSnapshot((snap) => {
    S.lectures = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    S.loaded.lectures = true;
    onData();
  }, onDbError);

  db.collection('ratings').onSnapshot((snap) => {
    const first = !S.loaded.ratings;
    S.ratings = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    S.loaded.ratings = true;
    if (!first) {
      for (const ch of snap.docChanges()) {
        if (ch.type !== 'removed' && !ch.doc.metadata.hasPendingWrites && !isMine(ch.doc.id)) announce(ch);
      }
    }
    onData();
  }, onDbError);

  db.collection('reports').onSnapshot((snap) => {
    const next = {};
    for (const d of snap.docs) {
      const body = d.data();
      if (body && body.report && typeof body.basis === 'string') {
        const stats = statsFor(ratingsFor(d.id));
        next[d.id] = { basis: body.basis, report: normalizeReport(body.report, stats.n ? stats : { n: 0, score: 0, verdict: null }, body.report.source === 'claude' ? 'claude' : 'ratings') };
        if (body.report.ratings_verdict) next[d.id].report.ratings_verdict = body.report.ratings_verdict;
      }
    }
    S.reports = next;
    S.loaded.reports = true;
    onData();
  }, onDbError);

  db.collection('modules').onSnapshot((snap) => {
    const next = {};
    for (const d of snap.docs) {
      const body = d.data();
      if (body && body.digest && typeof body.basis === 'string') next[d.id] = { basis: body.basis, digest: body.digest };
    }
    S.digests = next;
    S.loaded.modules = true;
    onData();
  }, onDbError);

  if (S.uid) {
    db.doc(`data/users/${S.uid}/catchup`).onSnapshot(
      (snap) => {
        const body = snap.exists ? snap.data() : null;
        const next = {
          items: body && body.items && typeof body.items === 'object' ? body.items : {},
          covered: body && body.covered && typeof body.covered === 'object' ? body.covered : {},
        };
        if (stable(next) === stable(S.debt)) return; // our own write coming back
        S.debt = next;
        onData();
      },
      () => {}
    );
  }
}

async function boot() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') {
    S.absent = true;
    renderView();
    return;
  }
  const [db, sample, user] = await Promise.all([c.use('db'), c.use('sample'), c.use('user')]);
  S.sample = sample;
  if (user) {
    try {
      S.canWrite = await user.can('data.write');
    } catch {
      S.canWrite = null;
    }
    try {
      S.uid = await user.id();
    } catch {
      S.uid = null;
    }
  }
  renderStatus();
  if (!db) {
    S.absent = true;
    renderView();
    return;
  }
  S.db = db;
  subscribe(db);
}

boot();
</script>
